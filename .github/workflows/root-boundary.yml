name: Root boundary proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-boundary:
    name: Prove root-to-job-principal boundary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Install contract-selected Ota
        id: ota
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
          contract-path: ota.yaml

      - name: Verify exact Ota source identity
        env:
          EXPECTED_OTA_REVISION: 787ac35f7d0195d2adae85e1113e26ce4a30acc2
          OBSERVED_OTA_REVISION: ${{ steps.ota.outputs.source-git-rev }}
        run: test "$OBSERVED_OTA_REVISION" = "$EXPECTED_OTA_REVISION"

      - name: Prove root boundary
        env:
          ROOT_TEST_TARGET: ${{ runner.temp }}/authority-launcher-root-target
        run: |
          CARGO_BIN_DIR="$(dirname "$(command -v cargo)")"
          OBSERVED_RUSTUP_HOME="$(rustup show home)"
          sudo env \
            PATH="$CARGO_BIN_DIR:/usr/bin:/bin" \
            RUSTUP_HOME="$OBSERVED_RUSTUP_HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            CARGO_TARGET_DIR="$ROOT_TEST_TARGET" \
            cargo test unix::tests::root_launch_drops_uid_gid_and_supplementary_groups -- --exact

      - name: Build pressure-only signed peer
        run: cargo build --features pressure-peer --bins

      - name: Create constrained pressure principal
        run: |
          sudo useradd --create-home --shell /usr/sbin/nologin ota-pressure
          pressure_uid=$(id -u ota-pressure)
          pressure_gid=$(id -g ota-pressure)
          test "$pressure_uid" -ne 0
          test "$(id -G ota-pressure | wc -w)" -eq 1
          test ! -S /var/run/docker.sock || sudo -u ota-pressure test ! -r /var/run/docker.sock
          printf 'PRESSURE_UID=%s\nPRESSURE_GID=%s\nPRESSURE_HOME=/home/ota-pressure\n' \
            "$pressure_uid" "$pressure_gid" >> "$GITHUB_ENV"

      - name: Install protected pressure binaries and authority binding
        run: |
          sudo install -d -o root -g root -m 0755 /usr/lib/ota-authority/bin /usr/lib/ota-authority/pressure-bin
          sudo install -d -o root -g root -m 0755 /etc/ota /var/lib/ota
          sudo install -o root -g root -m 0755 "$(command -v ota)" /usr/lib/ota-authority/bin/ota-pressure-core
          sudo install -o root -g root -m 0755 target/debug/ota-authority-launcher /usr/lib/ota-authority/bin/ota-authority-launcher
          sudo install -o root -g root -m 0700 target/debug/ota-authority-pressure-peer /usr/lib/ota-authority/bin/ota-authority-pressure-peer
          pressure_docker=$(mktemp)
          cat > "$pressure_docker" <<'SH'
          #!/bin/sh
          set -eu
          for fd in /proc/$$/fd/*; do
            target=$(readlink "$fd" 2>/dev/null || true)
            case "$target" in
              socket:*) echo "broker descriptor leaked into lifecycle manager" >&2; exit 97 ;;
            esac
          done
          state_file="${HOME}/.ota-authority-pressure-compose-running"
          case " $* " in
            *" up -d "*) : > "$state_file" ;;
            *" stop "*) rm -f "$state_file" ;;
            *" ps "*) test ! -f "$state_file" || printf '%s\n' pressure-database ;;
            *) echo "unsupported pressure manager invocation: $*" >&2; exit 64 ;;
          esac
          SH
          sudo install -o root -g root -m 0755 "$pressure_docker" /usr/lib/ota-authority/pressure-bin/docker
          rm -f "$pressure_docker"
          sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer provision \
            --ota-binary /usr/lib/ota-authority/bin/ota-pressure-core \
            --run-uid "$PRESSURE_UID" \
            --run-gid "$PRESSURE_GID" \
            --run-home "$PRESSURE_HOME"
          test "$(stat -c '%U:%G:%a' /etc/ota/crossing-brokers.json)" = "root:root:644"
          test "$(stat -c '%U:%G:%a' /etc/ota/authority-launcher.json)" = "root:root:600"
          test "$(stat -c '%U:%G:%a' /usr/lib/ota-authority/bin/ota-authority-pressure-peer)" = "root:root:700"
          sudo -u ota-pressure test ! -w /etc/ota/crossing-brokers.json
          sudo -u ota-pressure test ! -r /etc/ota/authority-launcher.json
          sudo -u ota-pressure test ! -r /usr/lib/ota-authority/bin/ota-authority-pressure-peer
          chmod 0700 "$GITHUB_WORKSPACE"
          sudo -u ota-pressure test ! -r "$GITHUB_WORKSPACE/src/bin/ota-authority-pressure-peer.rs"
          for socket in /var/run/docker.sock /run/docker.sock /run/containerd/containerd.sock /var/run/crio/crio.sock /run/podman/podman.sock; do
            test ! -S "$socket" || sudo -u ota-pressure test ! -r "$socket"
          done
          namei -l /etc/ota/authority-launcher.json /etc/ota/crossing-brokers.json /usr/lib/ota-authority/bin/ota-pressure-core

      - name: Exercise signed live and adversarial broker scenarios
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/authority-pressure-evidence
          PRESSURE_ROOT: /tmp/ota-authority-pressure-repos-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$PRESSURE_ROOT"
          cat > "$EVIDENCE_DIR/runtime-boundary.txt" <<'EOF'
          Bounded hosted conformance checks:
          - Core target principal is non-root and has no supplemental groups.
          - Standard Docker, containerd, CRI-O, and Podman control sockets are absent or unreadable.
          - Protected launcher configuration and pressure-only signing material are unreadable.
          - Ota launcher process policy applies no_new_privs and descriptor sanitization.
          This is not provider attestation or proof of host-wide isolation.
          EOF

          make_repo() {
            local scenario="$1"
            local repo="$PRESSURE_ROOT/$scenario"
            mkdir -p "$repo"
            cat > "$repo/ota.yaml" <<'YAML'
          version: 1
          project:
            name: authority-pressure
          governance:
            crossing_authority:
              authority_id: platform-release-authority
          tasks:
            publish:
              command:
                exe: ./pressure-task.sh
              safe_for_agent: false
          YAML
            cat > "$repo/pressure-task.sh" <<'SH'
          #!/bin/sh
          set -eu
          for fd in /proc/$$/fd/*; do
            target=$(readlink "$fd" 2>/dev/null || true)
            case "$target" in
              socket:*) echo "broker descriptor leaked into task" >&2; exit 97 ;;
            esac
          done
          printf x >> broker-executed
          SH
            chmod 0755 "$repo/pressure-task.sh"
            printf '.ota/\n' > "$repo/.gitignore"
            sudo chown -R "$PRESSURE_UID:$PRESSURE_GID" "$repo"
            (
              cd "$repo"
              find . -path './.ota' -prune -o -printf '%y %P %l\n' | sort
              find . -path './.ota' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$EVIDENCE_DIR/$scenario.before"
          }

          for scenario in live expired revoked wrong-scope replay unavailable pending-timeout pending-cancelled pending-late-approval insufficient-pre-wait-freshness pending-ambiguous; do
            make_repo "$scenario"
            repo="$PRESSURE_ROOT/$scenario"
            output="$EVIDENCE_DIR/$scenario.output"
            if [[ "$scenario" == live ]]; then
              (
                cd "$repo"
                sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
                  --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
                  --scenario "$scenario" \
                  -- run publish --grant platform-release-authority --reason pressure
              ) >"$output" 2>&1
              test -f "$repo/broker-executed"
              (
                cd "$repo"
                ota receipt --history --json
              ) > "$EVIDENCE_DIR/live.receipt-history.json"
              jq -e '.summary.archive_count == 1 and .summary.invalid_archive_count == 0' \
                "$EVIDENCE_DIR/live.receipt-history.json"
              archive_path=$(jq -r '.archives[0].archive_path' "$EVIDENCE_DIR/live.receipt-history.json")
              if [[ "$archive_path" != /* ]]; then
                archive_path="$repo/$archive_path"
              fi
              jq -e '
                .receipt.crossing.authority.authority_carrier == "authority_broker" and
                .receipt.crossing.authority.authority_separation_posture == "protected_launcher_attested_one_use" and
                .receipt.crossing.authority.archive_evidence.admission.binding_snapshot.schema_version == 2 and
                .receipt.crossing.authority.archive_evidence.admission.attestation.payload.attestation_protocol_version == "ota-runtime-boundary-attestation/v2" and
                .receipt.crossing.authority.archive_evidence.admission.attestation.payload.runtime_boundary.profile_id == "ota.runtime-boundary.protected-launcher/v1" and
                .receipt.crossing.authority.archive_evidence.admission.attestation.payload.runtime_boundary.profile_identity == .receipt.crossing.authority.archive_evidence.admission.binding_snapshot.attestation.profile_identity and
                [.receipt.crossing.authority.archive_evidence.admission.attestation.payload.runtime_boundary.observations[].name] == [
                  "job_principal_non_root",
                  "authority_binding_write_denied",
                  "attestor_state_write_denied",
                  "broker_credentials_absent_from_job",
                  "broker_credentials_absent_from_task",
                  "broker_session_non_inheritable",
                  "broker_session_not_reacquirable",
                  "host_control_socket_unavailable",
                  "privilege_escalation_unavailable",
                  "launcher_binary_identity_bound",
                  "launcher_config_identity_bound"
                ] and
                all(.receipt.crossing.authority.archive_evidence.admission.attestation.payload.runtime_boundary.observations[]; .state == "verified") and
                .receipt.crossing.authority.archive_evidence.admission.binding_snapshot.broker_verifiers[0].public_key != .receipt.crossing.authority.archive_evidence.admission.binding_snapshot.attestation.verifiers[0].public_key and
                .receipt.crossing.authority.transaction.state == "completed" and
                .receipt.crossing.authority.transaction.broker_consumption.consume_response.payload.state == "consumed" and
                .receipt.crossing.id == .receipt.crossing.authority.transaction.transaction_id and
                .receipt.crossing.authority.transaction.identity == .receipt.crossing.authority.archive_evidence.transaction.identity
              ' "$archive_path"
              cp "$archive_path" "$EVIDENCE_DIR/live.receipt-archive.json"
            else
              if (
                cd "$repo"
                sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
                  --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
                  --scenario "$scenario" \
                  -- run publish --grant platform-release-authority --reason pressure
              ) >"$output" 2>&1; then
                echo "$scenario unexpectedly executed" >&2
                exit 1
              fi
              test ! -e "$repo/broker-executed"
              (
                cd "$repo"
                find . -path './.ota' -prune -o -printf '%y %P %l\n' | sort
                find . -path './.ota' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum
              ) > "$EVIDENCE_DIR/$scenario.after"
              cmp "$EVIDENCE_DIR/$scenario.before" "$EVIDENCE_DIR/$scenario.after"
              test ! -e "$repo/.ota/receipts"
              test ! -e "$repo/.ota/contracts"
              case "$scenario" in
                expired)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: expired-decision' "$output"
                  ;;
                wrong-scope)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: wrong-scope-decision' "$output"
                  ;;
                unavailable)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: unavailable' "$output"
                  ;;
                pending-timeout)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: pending-timeout' "$output"
                  ;;
                pending-cancelled)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: pending-cancelled' "$output"
                  ;;
                pending-late-approval)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: late-approval-after-terminal-cancellation session-closed=true delivery-refused=true' "$output"
                  test "$(stat -c '%U:%G:%a' /var/lib/ota/pressure-late-approval.json)" = "root:root:600"
                  sudo cp /var/lib/ota/pressure-late-approval.json \
                    "$EVIDENCE_DIR/pending-late-approval.signed-decision.json"
                  sudo chown "$(id -u):$(id -g)" \
                    "$EVIDENCE_DIR/pending-late-approval.signed-decision.json"
                  jq -e '.payload.decision == "allowed" and .payload.approval_reference == "pressure:late-approval"' \
                    "$EVIDENCE_DIR/pending-late-approval.signed-decision.json"
                  ;;
                insufficient-pre-wait-freshness)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: insufficient-pre-wait-freshness required-seconds=32 attestation-seconds=31 authorization-request=false' "$output"
                  ;;
                pending-ambiguous)
                  test ! -e "$repo/.ota"
                  grep -q 'crossing_broker_admission_refused' "$output"
                  grep -q 'pressure-peer-scenario: pending-ambiguous' "$output"
                  ;;
                revoked)
                  test -d "$repo/.ota/state/crossings"
                  test -z "$(cd "$repo" && find .ota -mindepth 1 \
                    ! -path '.ota/state' \
                    ! -path '.ota/state/crossings' \
                    ! -path '.ota/state/crossings/*' -print -quit)"
                  grep -q 'crossing_broker_consumption_refused' "$output"
                  grep -q 'pressure-peer-scenario: revoked-consume' "$output"
                  ;;
                replay)
                  test -d "$repo/.ota/state/crossings"
                  test -z "$(cd "$repo" && find .ota -mindepth 1 \
                    ! -path '.ota/state' \
                    ! -path '.ota/state/crossings' \
                    ! -path '.ota/state/crossings/*' -print -quit)"
                  grep -q 'crossing_broker_consumption_refused' "$output"
                  grep -q 'pressure-peer-scenario: already-consumed' "$output"
                  ;;
              esac
            fi
          done

          make_repo consume-recovery
          recovery_repo="$PRESSURE_ROOT/consume-recovery"
          recovery_first="$EVIDENCE_DIR/consume-recovery-first.output"
          if (
            cd "$recovery_repo"
            sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
              --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
              --scenario consume-response-lost \
              -- run publish --grant platform-release-authority --reason pressure
          ) >"$recovery_first" 2>&1; then
            echo "lost consume response unexpectedly executed" >&2
            exit 1
          fi
          test ! -e "$recovery_repo/broker-executed"
          test "$(stat -c '%U:%G:%a' /var/lib/ota/pressure-consumption-recovery.json)" = "root:root:600"
          grep -q 'pressure-peer-scenario: consume-response-lost' "$recovery_first"
          grep -q 'crossing_broker_consumption_refused' "$recovery_first"
          (
            cd "$recovery_repo"
            find . -path './.ota' -prune -o -printf '%y %P %l\n' | sort
            find . -path './.ota' -prune -o -type f -print0 | sort -z | xargs -0 sha256sum
          ) > "$EVIDENCE_DIR/consume-recovery.after-first"
          cmp "$EVIDENCE_DIR/consume-recovery.before" "$EVIDENCE_DIR/consume-recovery.after-first"

          recovery_second="$EVIDENCE_DIR/consume-recovery-second.output"
          (
            cd "$recovery_repo"
            sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
              --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
              --scenario recovery-consumed \
              -- run publish --grant platform-release-authority --reason pressure
          ) >"$recovery_second" 2>&1
          test -f "$recovery_repo/broker-executed"
          test "$(wc -c < "$recovery_repo/broker-executed")" -eq 1
          grep -q 'pressure-peer-scenario: recovered-consumed-status' "$recovery_second"
          grep -q 'pressure-peer-scenario: recovery-consumed-then-fresh-consumed' "$recovery_second"
          jq -s -e '
            map(select(
              .state == "incomplete" and
              .receipt_status == "broker_consumption_recovered_without_execution" and
              .broker_consumption.consume_response.payload.state == "consumed" and
              .broker_consumption_recovery.status.payload.status.state == "consumed"
            )) | length == 1
          ' "$recovery_repo"/.ota/state/crossings/*/*.json
          (
            cd "$recovery_repo"
            ota receipt --history --json
          ) > "$EVIDENCE_DIR/consume-recovery.receipt-history.json"
          jq -e '.summary.archive_count == 1 and .summary.invalid_archive_count == 0' \
            "$EVIDENCE_DIR/consume-recovery.receipt-history.json"

          catch_all_repo="$PRESSURE_ROOT/catch-all"
          mkdir -p "$catch_all_repo"
          cat > "$catch_all_repo/ota.yaml" <<'YAML'
          version: 1
          project:
            name: authority-catch-all-pressure
          governance:
            crossing_authority:
              authority_id: platform-release-authority
          tasks:
            prepare-release:
              command:
                exe: ./pressure-task.sh
                args: [prepare]
              effects:
                writes: [broker-executed]
              safe_for_agent: false
            publish:
              command:
                exe: ./pressure-task.sh
                args: [publish]
              depends_on: [prepare-release]
              after_success: [audit-release]
              effects:
                writes: [broker-executed]
                network: true
                network_kind: broad
              safe_for_agent: false
            audit-release:
              command:
                exe: ./pressure-task.sh
                args: [audit]
              effects:
                writes: [broker-executed]
              safe_for_agent: false
          YAML
          cat > "$catch_all_repo/pressure-task.sh" <<'SH'
          #!/bin/sh
          set -eu
          for fd in /proc/$$/fd/*; do
            target=$(readlink "$fd" 2>/dev/null || true)
            case "$target" in
              socket:*) echo "broker descriptor leaked into catch-all task" >&2; exit 97 ;;
            esac
          done
          printf '%s\n' "$1" >> broker-executed
          SH
          chmod 0755 "$catch_all_repo/pressure-task.sh"
          printf '.ota/\n' > "$catch_all_repo/.gitignore"
          sudo chown -R "$PRESSURE_UID:$PRESSURE_GID" "$catch_all_repo"

          catch_all_first="$EVIDENCE_DIR/catch-all-first.output"
          (
            cd "$catch_all_repo"
            sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
              --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
              --scenario catch-all-first \
              -- run publish --grant platform-release-authority --reason pressure
          ) >"$catch_all_first" 2>&1
          catch_all_second="$EVIDENCE_DIR/catch-all-second.output"
          (
            cd "$catch_all_repo"
            sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
              --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
              --scenario catch-all-second \
              -- run publish --grant platform-release-authority --reason pressure
          ) >"$catch_all_second" 2>&1
          grep -q 'pressure-peer-scenario: catch-all-first-consumed' "$catch_all_first"
          grep -q 'pressure-peer-scenario: catch-all-second-distinct-work-unit-consumed' "$catch_all_second"
          test "$(stat -c '%U:%G:%a' /var/lib/ota/pressure-catch-all-invocation.json)" = "root:root:600"
          test "$(wc -l < "$catch_all_repo/broker-executed")" -eq 6
          test "$(grep -c '^prepare$' "$catch_all_repo/broker-executed")" -eq 2
          test "$(grep -c '^publish$' "$catch_all_repo/broker-executed")" -eq 2
          test "$(grep -c '^audit$' "$catch_all_repo/broker-executed")" -eq 2
          (
            cd "$catch_all_repo"
            ota receipt --history --json
          ) > "$EVIDENCE_DIR/catch-all.receipt-history.json"
          jq -e '.summary.archive_count == 2 and .summary.invalid_archive_count == 0' \
            "$EVIDENCE_DIR/catch-all.receipt-history.json"
          : > "$EVIDENCE_DIR/catch-all.work-units"
          archive_index=0
          while IFS= read -r archive_path; do
            if [[ "$archive_path" != /* ]]; then
              archive_path="$catch_all_repo/$archive_path"
            fi
            jq -e '
              .receipt.crossing.authority.authority_carrier == "authority_broker" and
              .receipt.crossing.authority.authority_separation_posture == "protected_launcher_attested_one_use" and
              .receipt.crossing.authority.archive_evidence.admission.binding_snapshot.schema_version == 2 and
              .receipt.crossing.authority.transaction.state == "completed" and
              .receipt.crossing.authority.archive_evidence.admission.semantic_scope.breadth.closure_node_count == 3 and
              .receipt.crossing.authority.archive_evidence.admission.semantic_scope.breadth.closure_edge_count >= 2 and
              (.receipt.crossing.authority.archive_evidence.admission.semantic_scope.breadth.effect_categories | index("repo_write") != null) and
              (.receipt.crossing.authority.archive_evidence.admission.semantic_scope.breadth.effect_categories | index("network") != null)
            ' "$archive_path"
            jq -r '.receipt.crossing.authority.broker.work_unit_identity' "$archive_path" \
              >> "$EVIDENCE_DIR/catch-all.work-units"
            cp "$archive_path" "$EVIDENCE_DIR/catch-all.receipt-archive-$archive_index.json"
            archive_index=$((archive_index + 1))
          done < <(jq -r '.archives[].archive_path' "$EVIDENCE_DIR/catch-all.receipt-history.json")
          test "$archive_index" -eq 2
          test "$(sort -u "$EVIDENCE_DIR/catch-all.work-units" | wc -l)" -eq 2

          ota --version --json > "$EVIDENCE_DIR/ota-version.json"
          jq -e \
            '.source_build == true and .dirty == false and .commit == "787ac35f"' \
            "$EVIDENCE_DIR/ota-version.json"

      - name: Exercise proof-wide broker authority
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/authority-pressure-evidence
          PROOF_ROOT: /tmp/ota-authority-proof-repos-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$PROOF_ROOT/runtime" "$PROOF_ROOT/lifecycle"

          cat > "$PROOF_ROOT/runtime/ota.yaml" <<'YAML'
          version: 1
          project:
            name: authority-runtime-proof
          governance:
            crossing_authority:
              authority_id: platform-release-authority
          surfaces:
            app:
              kind: http
              port: 38481
              readiness:
                kind: http
                path: /
                success:
                  status: [200]
          tasks:
            app:
              launch:
                kind: command
                exe: ./runtime-task.sh
              runtime:
                kind: service
                listeners:
                  app:
                    protocol: http
                    bind:
                      address: 127.0.0.1
                      port:
                        mode: fixed
                        value: 38481
                    project:
                      host:
                        address: 127.0.0.1
                        port:
                          mode: fixed
                          value: 38481
                        path: /
                        primary: true
                surfaces: [app]
                readiness:
                  kind: http
                  listener: app
                  path: /
              safe_for_agent: false
          workflows:
            default: smoke
            smoke:
              run:
                task: app
              readiness:
                surfaces: [app]
              proof:
                claim: bounded
          YAML
          cat > "$PROOF_ROOT/runtime/runtime-task.sh" <<'SH'
          #!/bin/sh
          set -eu
          for fd in /proc/$$/fd/*; do
            target=$(readlink "$fd" 2>/dev/null || true)
            case "$target" in
              socket:*) echo "broker descriptor leaked into runtime task" >&2; exit 97 ;;
            esac
          done
          exec python3 -m http.server 38481 --bind 127.0.0.1
          SH
          chmod 0755 "$PROOF_ROOT/runtime/runtime-task.sh"
          printf '.ota/\n' > "$PROOF_ROOT/runtime/.gitignore"
          (
            cd "$PROOF_ROOT/runtime"
            git init -q
            git config user.name ota-pressure
            git config user.email os@ota.run
            git add ota.yaml runtime-task.sh .gitignore
            git commit -qm "test: freeze runtime proof source"
          )
          sudo chown -R "$PRESSURE_UID:$PRESSURE_GID" "$PROOF_ROOT/runtime"

          (
            cd "$PROOF_ROOT/runtime"
            sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
              --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
              --scenario live \
              -- proof runtime --workflow smoke --grant platform-release-authority --archive --json
          ) > "$EVIDENCE_DIR/runtime-proof.json" 2> "$EVIDENCE_DIR/runtime-proof.stderr"
          jq -e '
            .ok == true and
            .proof_verdict == "passed_with_unproven_boundaries" and
            .crossing_evidence.authority.authority_carrier == "authority_broker" and
            .crossing_evidence.authority.authority_separation_posture == "protected_launcher_attested_one_use" and
            .crossing_evidence.proof_execution_id == .execution_id and
            .crossing_evidence.transaction_id == .crossing_evidence.authority.transaction.transaction_id and
            .crossing_evidence.authority.transaction.state == "completed" and
            (.archive.path | type == "string")
          ' "$EVIDENCE_DIR/runtime-proof.json"
          runtime_archive=$(jq -r '.archive.path' "$EVIDENCE_DIR/runtime-proof.json")
          if [[ "$runtime_archive" != /* ]]; then
            runtime_archive="$PROOF_ROOT/runtime/$runtime_archive"
          fi
          cp "$runtime_archive" "$EVIDENCE_DIR/runtime-proof.archive.json"
          jq -e '
            .version == 6 and
            .proof.execution_id == .proof.crossing_evidence.proof_execution_id and
            .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.schema_version == 2 and
            .proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.attestation_protocol_version == "ota-runtime-boundary-attestation/v2" and
            .proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.profile_id == "ota.runtime-boundary.protected-launcher/v1" and
            .proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.profile_identity == .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.attestation.profile_identity and
            [.proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.observations[].name] == [
              "job_principal_non_root",
              "authority_binding_write_denied",
              "attestor_state_write_denied",
              "broker_credentials_absent_from_job",
              "broker_credentials_absent_from_task",
              "broker_session_non_inheritable",
              "broker_session_not_reacquirable",
              "host_control_socket_unavailable",
              "privilege_escalation_unavailable",
              "launcher_binary_identity_bound",
              "launcher_config_identity_bound"
            ] and
            all(.proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.observations[]; .state == "verified") and
            .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.broker_verifiers[0].public_key != .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.attestation.verifiers[0].public_key and
            .proof.crossing_evidence.authority.transaction.state == "completed"
          ' "$runtime_archive"
          if (
            cd "$PROOF_ROOT/runtime"
            ota proof runtime --workflow smoke --grant platform-release-authority --json
          ) > "$EVIDENCE_DIR/runtime-proof.missing-launcher.stdout" \
            2> "$EVIDENCE_DIR/runtime-proof.missing-launcher.json"; then
            echo "runtime proof unexpectedly executed without launcher authority" >&2
            exit 1
          fi
          jq -e \
            --arg expected_scope "$(jq -r '.proof.crossing_evidence.scope_identity' "$runtime_archive")" \
            '.execution_started == false and
             .code == "crossing_broker_admission_refused" and
             .crossing_grant_admission.scope_identity == $expected_scope' \
            "$EVIDENCE_DIR/runtime-proof.missing-launcher.json"
          (
            cd "$PROOF_ROOT/runtime"
            ota doctor --json || true
          ) > "$EVIDENCE_DIR/runtime-proof.doctor.json"
          jq -e '
            any(.claim_assurance[];
              .family == "proof_breadth" and
              .subject.name == "smoke" and
              .assurance.status == "supported")
          ' "$EVIDENCE_DIR/runtime-proof.doctor.json"

          cat > "$PROOF_ROOT/lifecycle/ota.yaml" <<'YAML'
          version: 1
          project:
            name: authority-lifecycle-proof
          governance:
            crossing_authority:
              authority_id: platform-release-authority
          services:
            database:
              manager:
                kind: compose
                name: authority-lifecycle-proof
                file: compose.yaml
                service: database
              lifecycle:
                teardown_assertion: manager_inactive
          tasks:
            prepare:
              command:
                exe: ./assert-no-session.sh
                args: [sh, -c, "true"]
              safe_for_agent: false
            assert-database:
              command:
                exe: ./assert-no-session.sh
                args: [sh, -c, "docker compose -p authority-lifecycle-proof -f compose.yaml ps --status running -q database | grep -q ."]
              requires_services: [database]
              safe_for_agent: false
          workflows:
            default: smoke
            smoke:
              run:
                task: prepare
              proof:
                lifecycle:
                  services: [database]
                  assertion:
                    task: assert-database
          YAML
          cat > "$PROOF_ROOT/lifecycle/compose.yaml" <<'YAML'
          services:
            database:
              image: alpine:3.22
              command: [sh, -c, "while :; do sleep 3600; done"]
          YAML
          cat > "$PROOF_ROOT/lifecycle/assert-no-session.sh" <<'SH'
          #!/bin/sh
          set -eu
          for fd in /proc/$$/fd/*; do
            target=$(readlink "$fd" 2>/dev/null || true)
            case "$target" in
              socket:*) echo "broker descriptor leaked into lifecycle task" >&2; exit 97 ;;
            esac
          done
          exec "$@"
          SH
          chmod 0755 "$PROOF_ROOT/lifecycle/assert-no-session.sh"
          sudo chown -R "$PRESSURE_UID:$PRESSURE_GID" "$PROOF_ROOT/lifecycle"
          printf '%s\n' \
            'Pressure-only deterministic Compose control stub.' \
            'Proves Ota lifecycle authority, assertion ordering, finalization, and cleanup.' \
            'Does not prove Docker provider behavior or Docker socket isolation beyond inaccessibility.' \
            > "$EVIDENCE_DIR/lifecycle-provider-boundary.txt"

          (
            cd "$PROOF_ROOT/lifecycle"
            sudo /usr/lib/ota-authority/bin/ota-authority-pressure-peer execute \
              --launcher /usr/lib/ota-authority/bin/ota-authority-launcher \
              --scenario live \
              -- proof lifecycle --workflow smoke --grant platform-release-authority --archive --json
          ) > "$EVIDENCE_DIR/lifecycle-proof.json" 2> "$EVIDENCE_DIR/lifecycle-proof.stderr"
          jq -e '
            .ok == true and
            .proof_verdict == "passed_with_unproven_boundaries" and
            .crossing_evidence.authority.authority_carrier == "authority_broker" and
            .crossing_evidence.authority.authority_separation_posture == "protected_launcher_attested_one_use" and
            .crossing_evidence.proof_execution_id == .transaction_id and
            .crossing_evidence.transaction_id == .crossing_evidence.authority.transaction.transaction_id and
            .crossing_evidence.authority.transaction.state == "completed" and
            .finalization.state == "completed" and
            (.archive.path | type == "string")
          ' "$EVIDENCE_DIR/lifecycle-proof.json"
          lifecycle_archive=$(jq -r '.archive.path' "$EVIDENCE_DIR/lifecycle-proof.json")
          if [[ "$lifecycle_archive" != /* ]]; then
            lifecycle_archive="$PROOF_ROOT/lifecycle/$lifecycle_archive"
          fi
          cp "$lifecycle_archive" "$EVIDENCE_DIR/lifecycle-proof.archive.json"
          jq -e '
            .version == 3 and
            .proof.transaction_id == .proof.crossing_evidence.proof_execution_id and
            .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.schema_version == 2 and
            .proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.attestation_protocol_version == "ota-runtime-boundary-attestation/v2" and
            .proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.profile_id == "ota.runtime-boundary.protected-launcher/v1" and
            .proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.profile_identity == .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.attestation.profile_identity and
            [.proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.observations[].name] == [
              "job_principal_non_root",
              "authority_binding_write_denied",
              "attestor_state_write_denied",
              "broker_credentials_absent_from_job",
              "broker_credentials_absent_from_task",
              "broker_session_non_inheritable",
              "broker_session_not_reacquirable",
              "host_control_socket_unavailable",
              "privilege_escalation_unavailable",
              "launcher_binary_identity_bound",
              "launcher_config_identity_bound"
            ] and
            all(.proof.crossing_evidence.authority.archive_evidence.admission.attestation.payload.runtime_boundary.observations[]; .state == "verified") and
            .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.broker_verifiers[0].public_key != .proof.crossing_evidence.authority.archive_evidence.admission.binding_snapshot.attestation.verifiers[0].public_key and
            .proof.crossing_evidence.authority.transaction.state == "completed" and
            .proof.finalization.state == "completed"
          ' "$lifecycle_archive"
          test ! -e "$PRESSURE_HOME/.ota-authority-pressure-compose-running"

      - name: Upload bounded pressure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authority-launcher-pressure-${{ github.run_id }}
          path: ${{ runner.temp }}/authority-pressure-evidence
          if-no-files-found: error
          retention-days: 14
