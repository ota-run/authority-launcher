name: Systemd V3 administrator recovery trigger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemd-v3-administrator-recovery-trigger
  cancel-in-progress: false

jobs:
  invoke-prepared-fault:
    name: Invoke the administrator-prepared fault once
    runs-on: [self-hosted, Linux, X64, ota-authority-independent]
    timeout-minutes: 10
    env:
      AUTHORITY_ID: platform-release-authority
      CLIENT: /usr/lib/ota-authority/bin/ota-authority-systemd-client
      PRESSURE_REPOSITORY: /srv/ota-v3-pressure
    steps:
      - name: Invoke the frozen production-client request
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test "$(uname -m)" = x86_64
          test "$(ps -p 1 -o comm=)" = systemd
          grep -Fxq '0::/system.slice/ota-authority-pressure-runner.service' /proc/self/cgroup

          result="$RUNNER_TEMP/administrator-recovery-trigger.json"
          set +e
          "$CLIENT" --json --administrator-controlled-recovery \
            --authority-id "$AUTHORITY_ID" \
            --repository "$PRESSURE_REPOSITORY" -- \
            run governed --grant "$AUTHORITY_ID" --receipt >"$result"
          status=$?
          set -e
          cat "$result"
          test "$status" -eq 75
          python3 - "$result" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          if (
              evidence.get("ok") is not False
              or evidence.get("kind") != "systemd_protected_launcher_client_refusal"
              or evidence.get("reason") != "output_incomplete"
              or evidence.get("execution_started") is not True
          ):
              raise SystemExit("the production client did not stop at the prepared recovery boundary")
          PY
