name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Install contract-selected Ota
        id: ota
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
          contract-path: ota.yaml

      - name: Verify exact Ota source identity
        env:
          EXPECTED_OTA_REVISION: 2ad72af480fed2973601f7b8253be10961fa5fc5
          OBSERVED_OTA_REVISION: ${{ steps.ota.outputs.source-git-rev }}
        run: test "$OBSERVED_OTA_REVISION" = "$EXPECTED_OTA_REVISION"

      - name: Validate contract
        run: ota validate

      - name: Run contract-owned verification
        run: ota run verify --agent
