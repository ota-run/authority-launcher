name: Systemd V3 selected-execution pressure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemd-v3:
    name: Prove signed V3 one-use selected execution and refusal cleanup
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Launcher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Install contract-selected Ota
        id: ota
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
          contract-path: ota.yaml

      - name: Verify immutable source identities
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/systemd-v3-evidence
          EXPECTED_OTA_REVISION: ${{ steps.ota.outputs.source-git-rev }}
          EXPECTED_PROTOCOL_REVISION: 9fb00a4ab0f1b4c635dbab67c2e6b140b8eade9c
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ota --version --json > "$EVIDENCE_DIR/ota-version.json"
          observed_commit=$(jq -er '.commit' "$EVIDENCE_DIR/ota-version.json")
          jq -e '.source_build == true and .dirty == false' "$EVIDENCE_DIR/ota-version.json"
          test -n "$EXPECTED_OTA_REVISION"
          test "${EXPECTED_OTA_REVISION#"$observed_commit"}" != "$EXPECTED_OTA_REVISION"

          git rev-parse HEAD > "$EVIDENCE_DIR/launcher-revision.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo metadata --locked --format-version 1 > "$EVIDENCE_DIR/cargo-metadata.json"
          protocol_source=$(jq -er '
            .packages[] |
            select(.name == "ota-authority-protocol") |
            .source
          ' "$EVIDENCE_DIR/cargo-metadata.json")
          test "$protocol_source" = \
            "git+https://github.com/ota-run/authority-protocol.git?rev=${EXPECTED_PROTOCOL_REVISION}#${EXPECTED_PROTOCOL_REVISION}"

      - name: Build exact pressure binaries
        run: |
          set -euo pipefail
          cargo build --release --locked --bins --features \
            'protected-attestor protected-attestor-client systemd-pressure-client systemd-pressure-faults systemd-v3-pressure-provision systemd-decision-pressure-peer'

      - name: Provision protected systemd V3 boundary
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/systemd-v3-evidence
          PRESSURE_REPOSITORY: /srv/ota-v3-pressure
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(ps -p 1 -o comm=)" = systemd

          sudo useradd --system --create-home --shell /usr/sbin/nologin ota-authority-job
          sudo useradd --system --create-home --shell /usr/sbin/nologin ota-authority-exec
          test "$(id -u ota-authority-job)" -ne 0
          test "$(id -u ota-authority-exec)" -ne 0
          test "$(id -u ota-authority-job)" -ne "$(id -u ota-authority-exec)"

          sudo install -d -o ota-authority-exec -g ota-authority-exec -m 0755 "$PRESSURE_REPOSITORY"
          sudo tee "$PRESSURE_REPOSITORY/ota.yaml" >/dev/null <<'YAML'
          version: 1
          project:
            name: systemd-v3-pressure
          governance:
            crossing_authority:
              authority_id: platform-release-authority
          tasks:
            governed:
              description: One selected execution that records an exact pressure sentinel
              command:
                exe: python3
                args:
                  - -c
                  - "from pathlib import Path; Path('selected-work-executed').open('a').write('executed\\n')"
              safe_for_agent: false
          YAML
          sudo chown ota-authority-exec:ota-authority-exec "$PRESSURE_REPOSITORY/ota.yaml"
          sudo chmod 0644 "$PRESSURE_REPOSITORY/ota.yaml"
          (cd "$PRESSURE_REPOSITORY" && ota validate --json) \
            > "$EVIDENCE_DIR/pressure-contract-validation.json"
          jq -e '.ok == true' "$EVIDENCE_DIR/pressure-contract-validation.json"

          sudo install -d -o root -g root -m 0755 /usr/lib/ota-authority/bin
          sudo install -o root -g root -m 0755 target/release/ota-authority-launcher \
            /usr/lib/ota-authority/bin/ota-authority-launcher
          sudo install -o root -g root -m 0755 target/release/ota-authority-attestor \
            /usr/lib/ota-authority/bin/ota-authority-attestor
          sudo install -o root -g root -m 0755 target/release/ota-authority-systemd-pressure-client \
            /usr/lib/ota-authority/bin/ota-authority-systemd-pressure-client
          sudo install -o root -g root -m 0755 target/release/ota-authority-systemd-decision-peer \
            /usr/lib/ota-authority/bin/ota-authority-systemd-decision-peer
          sudo install -o root -g root -m 0755 "$(command -v ota)" \
            /usr/lib/ota-authority/bin/ota

          sudo /usr/lib/ota-authority/bin/ota-authority-launcher \
            provision-systemd-v3-pressure \
            --authority-id platform-release-authority \
            --job-user ota-authority-job \
            --execution-user ota-authority-exec \
            --repository-root "$PRESSURE_REPOSITORY" \
            --launcher-binary /usr/lib/ota-authority/bin/ota-authority-launcher \
            --attestor-binary /usr/lib/ota-authority/bin/ota-authority-attestor \
            --broker-decision-binary /usr/lib/ota-authority/bin/ota-authority-systemd-decision-peer \
            --ota-binary /usr/lib/ota-authority/bin/ota \
            --pressure-client-binary /usr/lib/ota-authority/bin/ota-authority-systemd-pressure-client \
            | tee "$EVIDENCE_DIR/provision.txt"

          sha256sum \
            /usr/lib/ota-authority/bin/ota-authority-launcher \
            /usr/lib/ota-authority/bin/ota-authority-attestor \
            /usr/lib/ota-authority/bin/ota-authority-systemd-decision-peer \
            /usr/lib/ota-authority/bin/ota-authority-systemd-pressure-client \
            /usr/lib/ota-authority/bin/ota \
            > "$EVIDENCE_DIR/installed-binaries.sha256"
          sudo cp /etc/ota/authority-launcher-installation.json \
            "$EVIDENCE_DIR/installation-manifest.json"
          sudo cp /etc/ota/authority-attestor-verifiers.json \
            "$EVIDENCE_DIR/attestor-verifiers.json"
          sudo cp /etc/ota/crossing-brokers.json \
            "$EVIDENCE_DIR/broker-verifier-binding.json"
          sudo chown "$(id -u):$(id -g)" \
            "$EVIDENCE_DIR/installation-manifest.json" \
            "$EVIDENCE_DIR/attestor-verifiers.json" \
            "$EVIDENCE_DIR/broker-verifier-binding.json"
          jq -e \
            '.schema_version == 1
             and (.bindings | length) == 1
             and .bindings[0].authority_id == "platform-release-authority"
             and (.bindings[0].broker_verifiers | length) == 1
             and .bindings[0].broker_verifiers[0].key_id == "systemd-broker-pressure-v1"' \
            "$EVIDENCE_DIR/broker-verifier-binding.json"

      - name: Exercise positive, drift, credential, and recovery controls
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/systemd-v3-evidence
          PRESSURE_REPOSITORY: /srv/ota-v3-pressure
        run: |
          set -euo pipefail

          repository_manifest() {
            sudo python3 - "$PRESSURE_REPOSITORY" <<'PY'
          import hashlib
          import json
          import os
          import stat
          import sys

          root = os.path.abspath(sys.argv[1])
          paths = [root]
          for directory, names, files in os.walk(root, topdown=True, followlinks=False):
              names.sort()
              files.sort()
              paths.extend(os.path.join(directory, name) for name in names)
              paths.extend(os.path.join(directory, name) for name in files)
              names[:] = [name for name in names if not os.path.islink(os.path.join(directory, name))]

          for path in sorted(set(paths), key=lambda value: os.fsencode(os.path.relpath(value, root))):
              metadata = os.lstat(path)
              mode = metadata.st_mode
              if stat.S_ISREG(mode):
                  kind = "file"
              elif stat.S_ISDIR(mode):
                  kind = "directory"
              elif stat.S_ISLNK(mode):
                  kind = "symlink"
              elif stat.S_ISFIFO(mode):
                  kind = "fifo"
              elif stat.S_ISSOCK(mode):
                  kind = "socket"
              elif stat.S_ISCHR(mode):
                  kind = "character_device"
              elif stat.S_ISBLK(mode):
                  kind = "block_device"
              else:
                  kind = "unknown"
              record = {
                  "gid": metadata.st_gid,
                  "kind": kind,
                  "mode": format(stat.S_IMODE(mode), "04o"),
                  "mtime_ns": metadata.st_mtime_ns,
                  "path": os.path.relpath(path, root),
                  "size": metadata.st_size,
                  "uid": metadata.st_uid,
              }
              if kind == "file":
                  digest = hashlib.sha256()
                  with open(path, "rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  record["sha256"] = digest.hexdigest()
              elif kind == "symlink":
                  record["target"] = os.readlink(path)
              print(json.dumps(record, ensure_ascii=True, sort_keys=True, separators=(",", ":")))
          PY
          }

          repository_content_manifest() {
            # Selected execution necessarily changes directory timestamps while creating and
            # removing its declared output and Ota receipt state. Compare durable tree shape,
            # ownership, modes, sizes, links, and file content instead of impossible timestamp
            # restoration. Refusal cases continue to use the stricter manifest above.
            repository_manifest | jq -c 'del(.mtime_ns)'
          }

          assert_terminal_clean() {
            local case_name=$1
            local selected=${2:-false}
            local expected_execution_count=${3:-1}
            local slots scopes
            slots=$(sudo find /var/lib/ota/authority-launcher/active -mindepth 1 -maxdepth 1 -type f | wc -l)
            scopes=$(systemctl list-units 'ota-authority-invocation-*.scope' --all --no-legend --plain | wc -l)
            printf 'active_slots=%s\nscopes=%s\n' "$slots" "$scopes" \
              > "$EVIDENCE_DIR/$case_name.boundary.txt"
            test "$slots" -eq 0
            test "$scopes" -eq 0
            if test "$selected" = true; then
              test "$(sudo wc -l "$PRESSURE_REPOSITORY/selected-work-executed" \
                | awk '{print $1}')" -eq "$expected_execution_count"
              test "$(sudo grep -c '^executed$' \
                "$PRESSURE_REPOSITORY/selected-work-executed")" -eq "$expected_execution_count"
              sudo test -d "$PRESSURE_REPOSITORY/.ota/receipts"
            else
              test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"
              test ! -e "$PRESSURE_REPOSITORY/.ota"
            fi
          }

          capture_journal() {
            local case_name=$1
            local cursor=$2
            test -n "$cursor"
            sudo journalctl --no-pager \
              --after-cursor "$cursor" \
              -u ota-authority-pressure-runner.service \
              -u ota-authority-launcher.service \
              -u ota-authority-attestor.service \
              -u ota-authority-broker-proxy.service \
              | tee "$EVIDENCE_DIR/$case_name.journal.txt" >/dev/null
          }

          capture_client_json() {
            local case_name=$1
            local cursor=$2
            sudo journalctl --no-pager --output=cat \
              --after-cursor "$cursor" \
              -t ota-authority-pressure-client \
              | tee "$EVIDENCE_DIR/$case_name.client-journal.txt" >/dev/null
            sed -n '/^{/,/^}$/p' "$EVIDENCE_DIR/$case_name.client-journal.txt" \
              > "$EVIDENCE_DIR/$case_name.json"
            test -s "$EVIDENCE_DIR/$case_name.json"
          }

          journal_cursor() {
            sudo journalctl --no-pager -n 0 --show-cursor \
              | sed -n 's/^-- cursor: //p'
          }

          assert_count() {
            local expected=$1
            local pattern=$2
            local file=$3
            local observed
            observed=$(grep -c -- "$pattern" "$file" || true)
            test "$observed" -eq "$expected"
          }

          assert_broker_checkpoint() {
            local case_name=$1
            local scenario=$2
            local ordinal=$3
            local decision=$4
            assert_count 1 \
              "bounded pressure decision_sent scenario=$scenario ordinal=$ordinal decision=$decision" \
              "$EVIDENCE_DIR/$case_name.journal.txt"
          }

          extract_relay_evidence() {
            local case_name=$1
            local expected_count=$2
            local expected_decision=${3:-}
            local output="$EVIDENCE_DIR/$case_name.relay-evidence.jsonl"
            sed -n 's/^.*bounded pressure authorization relay evidence=//p' \
              "$EVIDENCE_DIR/$case_name.journal.txt" > "$output"
            test "$(wc -l < "$output")" -eq "$expected_count"
            if test "$expected_count" -gt 0; then
              jq -s -e -c \
                --arg decision "$expected_decision" \
                'all(.[];
                   .schema_version == 1
                   and .authorization_decision.payload.decision == $decision
                   and .authorization_decision_identity == .admission.authorization_decision_identity
                   and .request_identity == .admission.request_identity)' \
                "$output" >/dev/null
            fi
          }

          extract_consumption_relay_evidence() {
            local case_name=$1
            local expected_count=$2
            local output="$EVIDENCE_DIR/$case_name.lease-relay-evidence.jsonl"
            sed -n 's/^.*bounded pressure lease relay evidence=//p' \
              "$EVIDENCE_DIR/$case_name.journal.txt" > "$output"
            test "$(wc -l < "$output")" -eq "$expected_count"
            if test "$expected_count" -gt 0; then
              jq -s -e -c \
                'all(.[];
                   .schema_version == 1
                   and .consume_response.payload.state == "consumed"
                   and .prepared_lease_identity == .consume_request.lease_identity
                   and .consume_request_identity == .consume_response.payload.consume_request_identity
                   and .admission.prepared_lease_identity == .prepared_lease_identity
                   and .admission.consume_request_identity == .consume_request_identity
                   and .admission.consume_response_identity == .consume_response_identity)' \
                "$output" >/dev/null
            fi
          }

          extract_exact_replay_refusal() {
            local case_name=$1
            local output="$EVIDENCE_DIR/$case_name.exact-replay-refusal.jsonl"
            sed -n 's/^.*bounded pressure exact_replay_refused [^ ]* [^ ]* evidence=//p' \
              "$EVIDENCE_DIR/$case_name.journal.txt" > "$output"
            test "$(wc -l < "$output")" -eq 1
            jq -s -e -c \
              'length == 1
               and .[0].payload.message_kind == "lease_consume_response"
               and .[0].payload.state == "already_consumed"
               and .[0].algorithm == "ed25519"
               and .[0].key_id == "systemd-broker-pressure-v1"' \
              "$output" >/dev/null
            jq -e -n \
              --slurpfile consumed "$EVIDENCE_DIR/$case_name.lease-relay-evidence.jsonl" \
              --slurpfile replay "$output" \
              '($consumed | length) == 1
               and ($replay | length == 1)
               and $consumed[0].prepared_lease_identity == $replay[0].payload.lease_identity
               and $consumed[0].consume_request_identity == $replay[0].payload.consume_request_identity
               and $consumed[0].consume_response.payload.state == "consumed"'
          }

          extract_broker_decisions() {
            local case_name=$1
            local expected_count=$2
            local expected_decision=$3
            local output="$EVIDENCE_DIR/$case_name.broker-decisions.jsonl"
            sed -n 's/^.*bounded pressure signed decision [^ ]* [^ ]* evidence=//p' \
              "$EVIDENCE_DIR/$case_name.journal.txt" > "$output"
            test "$(wc -l < "$output")" -eq "$expected_count"
            jq -s -e -c \
              --arg decision "$expected_decision" \
              'all(.[];
                 .payload.message_kind == "authorization_decision"
                 and .payload.decision == $decision
                 and .algorithm == "ed25519"
                 and .key_id == "systemd-broker-pressure-v1")' \
              "$output" >/dev/null
          }

          reset_services() {
            sudo systemctl stop \
              ota-authority-pressure-runner.service \
              ota-authority-launcher.service \
              ota-authority-attestor.service \
              ota-authority-broker-proxy.service || true
            sudo systemctl reset-failed
          }

          set_broker_scenario() {
            local scenario=$1
            sudo systemctl stop ota-authority-broker-proxy.service || true
            printf '%s\n' "$scenario" \
              | sudo tee /run/ota/authority-broker-pressure-scenario >/dev/null
            sudo chown root:root /run/ota/authority-broker-pressure-scenario
            sudo chmod 0600 /run/ota/authority-broker-pressure-scenario
          }

          run_decision_case() {
            local case_name=$1
            local scenario=$2
            local expected_terminal=$3
            local cursor
            repository_manifest > "$EVIDENCE_DIR/$case_name.repository.before.sha256"
            reset_services
            set_broker_scenario "$scenario"
            cursor=$(journal_cursor)
            if ! sudo systemctl start ota-authority-pressure-runner.service; then
              capture_journal "$case_name-start-failure" "$cursor"
              systemctl show \
                ota-authority-pressure-runner.service \
                ota-authority-launcher.service \
                ota-authority-attestor.service \
                ota-authority-broker-proxy.service \
                > "$EVIDENCE_DIR/$case_name-start-failure.units.txt"
              exit 1
            fi
            capture_journal "$case_name" "$cursor"
            sudo journalctl --no-pager --output=cat \
              --after-cursor "$cursor" \
              -t ota-authority-pressure-client \
              | tee "$EVIDENCE_DIR/$case_name.client-journal.txt" >/dev/null
            sed -n '/^{/,/^}$/p' \
              "$EVIDENCE_DIR/$case_name.client-journal.txt" \
              > "$EVIDENCE_DIR/$case_name.json"
            test -s "$EVIDENCE_DIR/$case_name.json"
            case "$expected_terminal" in
              denied-decision)
                expected_stage=authority_refused_boundary_removed
                ;;
              protocol-refusal)
                expected_stage=pre_authorization_protocol_refused_boundary_removed
                ;;
              *)
                exit 1
                ;;
            esac
            jq -e --arg stage "$expected_stage" \
              '.ok == true and .terminal.stage == $stage' \
              "$EVIDENCE_DIR/$case_name.json"
            assert_terminal_clean "$case_name"
            repository_manifest > "$EVIDENCE_DIR/$case_name.repository.after.sha256"
            diff -u "$EVIDENCE_DIR/$case_name.repository.before.sha256" \
              "$EVIDENCE_DIR/$case_name.repository.after.sha256"
          }

          repository_content_manifest > "$EVIDENCE_DIR/repository.before.sha256"
          repository_manifest > "$EVIDENCE_DIR/positive.repository.before.sha256"

          case_cursor=$(journal_cursor)
          if ! sudo systemctl start ota-authority-pressure-runner.service; then
            capture_journal positive-start-failure "$case_cursor"
            systemctl show \
              ota-authority-pressure-runner.service \
              ota-authority-launcher.service \
              ota-authority-attestor.service \
              ota-authority-broker-proxy.service \
              > "$EVIDENCE_DIR/positive-start-failure.units.txt"
            exit 1
          fi
          capture_journal positive "$case_cursor"
          grep -q 'bounded pressure v3 stage=startup_continuation_sent' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=challenge_received' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=challenge_validated' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=attestation_produced' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=attestation_sent' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=authorization_received' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=authorization_request_forwarded' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=authorization_decision_relayed' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=authorization_decision_verified' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=prepared_lease_relayed' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=lease_consume_forwarded' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=lease_consumption_response_relayed' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=lease_consumption_persisted' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure lease_consumed_relayed' "$EVIDENCE_DIR/positive.journal.txt"
          assert_broker_checkpoint positive allowed 1 allowed
          assert_count 1 'bounded pressure v3 stage=authorization_decision_verified' \
            "$EVIDENCE_DIR/positive.journal.txt"
          extract_broker_decisions positive 1 allowed
          extract_relay_evidence positive 1 allowed
          extract_consumption_relay_evidence positive 1
          extract_exact_replay_refusal positive
          capture_client_json positive "$case_cursor"
          jq -e \
            '.ok == true
             and .terminal.stage == "selected_execution_completed_boundary_removed"
             and .terminal.outcome == "completed"
             and .terminal.exit_code == 0
             and .terminal.finalization.child_reaped == true
             and .terminal.finalization.scope_removed == true
             and .terminal.finalization.cgroup_empty_or_absent == true
             and .terminal.finalization.active_slot_removed == true
             and .terminal.finalization.completion.outcome == "completed"' \
            "$EVIDENCE_DIR/positive.json"
          sudo find "$PRESSURE_REPOSITORY" -printf '%M %u %g %p\n' \
            | sort > "$EVIDENCE_DIR/positive.repository-tree.txt"
          assert_terminal_clean positive true
          sudo cp -a "$PRESSURE_REPOSITORY/.ota" "$EVIDENCE_DIR/positive-ota-evidence"
          sudo chown -R "$(id -u):$(id -g)" "$EVIDENCE_DIR/positive-ota-evidence"
          set +e
          sudo sh -c \
            'cd "$1" && /usr/lib/ota-authority/bin/ota receipt --history --json' \
            sh "$PRESSURE_REPOSITORY" \
            2> >(tee "$EVIDENCE_DIR/positive.receipt-history.stderr.txt" >&2) \
            | tee "$EVIDENCE_DIR/positive.receipt-history.json"
          receipt_history_status=${PIPESTATUS[0]}
          set -e
          test "$receipt_history_status" -eq 0
          jq -e \
            '.ok == true
             and .summary.archive_count == 1
             and .summary.invalid_archive_count == 0
             and (.archives | length) == 1
             and (.invalid_archives | length) == 0' \
            "$EVIDENCE_DIR/positive.receipt-history.json"
          repository_manifest > "$EVIDENCE_DIR/positive.repository.after.sha256"
          if cmp -s "$EVIDENCE_DIR/positive.repository.before.sha256" \
            "$EVIDENCE_DIR/positive.repository.after.sha256"; then
            echo 'selected execution did not change the repository manifest' >&2
            exit 1
          fi
          test "$(systemctl show ota-authority-pressure-runner.service -p Result --value)" = success
          test "$(systemctl is-active ota-authority-attestor.service || true)" != active
          test "$(systemctl is-active ota-authority-broker-proxy.service || true)" != active

          sudo rm -rf "$PRESSURE_REPOSITORY/.ota" \
            "$PRESSURE_REPOSITORY/selected-work-executed"

          repository_content_manifest > "$EVIDENCE_DIR/completion-crash.repository.before.sha256"
          reset_services
          set_broker_scenario allowed
