            "$EVIDENCE_DIR/decision-crash-first.active-slot.json"
          sudo chown "$(id -u):$(id -g)" \
            "$EVIDENCE_DIR/decision-crash-first.active-slot.json"
          jq -e \
            '.stage == "authorization_decision_verified"
             and .child != null
             and .scope != null
             and .authorization_decision.authorization_decision.payload.decision == "allowed"
             and .authorization_decision.admission.decision == "allowed"' \
            "$EVIDENCE_DIR/decision-crash-first.active-slot.json"
          assert_broker_checkpoint decision-crash-first allowed 1 allowed
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"
          test ! -e "$PRESSURE_REPOSITORY/.ota"

          sudo systemctl reset-failed
          case_cursor=$(journal_cursor)
          if ! sudo systemctl start ota-authority-pressure-runner.service; then
            capture_journal decision-crash-recovery-start-failure "$case_cursor"
            systemctl show \
              ota-authority-pressure-runner.service \
              ota-authority-launcher.service \
              ota-authority-attestor.service \
              ota-authority-broker-proxy.service \
              > "$EVIDENCE_DIR/decision-crash-recovery-start-failure.units.txt"
            exit 1
          fi
          capture_journal decision-crash-recovery "$case_cursor"
          assert_broker_checkpoint decision-crash-recovery allowed 1 allowed
          assert_count 1 'bounded pressure v3 stage=authorization_request_forwarded' \
            "$EVIDENCE_DIR/decision-crash-recovery.journal.txt"
          assert_count 1 'bounded pressure v3 stage=authorization_decision_relayed' \
            "$EVIDENCE_DIR/decision-crash-recovery.journal.txt"
          assert_count 1 'bounded pressure v3 stage=authorization_decision_verified' \
            "$EVIDENCE_DIR/decision-crash-recovery.journal.txt"
          extract_broker_decisions decision-crash-recovery 1 allowed
          extract_relay_evidence decision-crash-recovery 1 allowed
          crashed_request=$(jq -r '.authorization_decision.request_identity' \
            "$EVIDENCE_DIR/decision-crash-first.active-slot.json")
          fresh_request=$(jq -r '.request_identity' \
            "$EVIDENCE_DIR/decision-crash-recovery.relay-evidence.jsonl")
          crashed_scope=$(jq -r \
            '.authorization_decision.authorization_decision.payload.semantic_scope_identity' \
            "$EVIDENCE_DIR/decision-crash-first.active-slot.json")
          fresh_scope=$(jq -r \
            '.authorization_decision.payload.semantic_scope_identity' \
            "$EVIDENCE_DIR/decision-crash-recovery.relay-evidence.jsonl")
          test "$fresh_request" != "$crashed_request"
          test "$fresh_scope" = "$crashed_scope"
          assert_terminal_clean decision-crash-recovery
          repository_manifest > "$EVIDENCE_DIR/decision-crash.repository.after.sha256"
          diff -u "$EVIDENCE_DIR/decision-crash.repository.before.sha256" \
            "$EVIDENCE_DIR/decision-crash.repository.after.sha256"

          repository_manifest > "$EVIDENCE_DIR/intent-ack-crash.repository.before.sha256"
          reset_services
          set_broker_scenario allowed
          sudo install -o root -g root -m 0600 /dev/null \
            /run/ota/authority-launcher-pressure-exit-after-intent-ack
          case_cursor=$(journal_cursor)
          if sudo systemctl start ota-authority-pressure-runner.service; then
            echo 'post-intent-ack crash injection unexpectedly completed' >&2
            exit 1
          fi
          capture_journal intent-ack-crash-first "$case_cursor"
          test "$(systemctl show ota-authority-launcher.service -p ExecMainStatus --value)" = 89
          intent_ack_slots=$(sudo find /var/lib/ota/authority-launcher/active \
            -mindepth 1 -maxdepth 1 -type f | wc -l)
          test "$intent_ack_slots" -eq 1
          intent_ack_slot=$(sudo find /var/lib/ota/authority-launcher/active \
            -mindepth 1 -maxdepth 1 -type f -print -quit)
          sudo cp "$intent_ack_slot" \
            "$EVIDENCE_DIR/intent-ack-crash-first.active-slot.json"
          sudo chown "$(id -u):$(id -g)" \
            "$EVIDENCE_DIR/intent-ack-crash-first.active-slot.json"
          jq -e \
            '.stage == "lease_consumption_intent_recorded"
             and .authorization_decision.authorization_decision.payload.decision == "allowed"
             and .lease_consumption_intent != null
             and .lease_consumption == null' \
            "$EVIDENCE_DIR/intent-ack-crash-first.active-slot.json"
          assert_broker_checkpoint intent-ack-crash-first allowed 1 allowed
          assert_count 1 'bounded pressure v3 stage=lease_consumption_intent_persisted' \
            "$EVIDENCE_DIR/intent-ack-crash-first.journal.txt"
          assert_count 0 'bounded pressure v3 stage=lease_consume_forwarded' \
            "$EVIDENCE_DIR/intent-ack-crash-first.journal.txt"
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"
          test ! -e "$PRESSURE_REPOSITORY/.ota"

          sudo systemctl reset-failed
          case_cursor=$(journal_cursor)
          if ! sudo systemctl start ota-authority-pressure-runner.service; then
            capture_journal intent-ack-crash-recovery-start-failure "$case_cursor"
            exit 1
          fi
          capture_journal intent-ack-crash-recovery "$case_cursor"
          assert_terminal_clean intent-ack-crash-recovery
          assert_count 1 'bounded pressure v3 stage=lease_consume_forwarded' \
            "$EVIDENCE_DIR/intent-ack-crash-recovery.journal.txt"
          extract_consumption_relay_evidence intent-ack-crash-recovery 1
          abandoned_intent_consume=$(jq -r \
            '.lease_consumption_intent.consume_request_identity' \
            "$EVIDENCE_DIR/intent-ack-crash-first.active-slot.json")
          retry_consume=$(jq -r '.consume_request_identity' \
            "$EVIDENCE_DIR/intent-ack-crash-recovery.lease-relay-evidence.jsonl")
          test "$retry_consume" != "$abandoned_intent_consume"
          test "$(sudo find /var/lib/ota/authority-launcher/active \
            -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0
          repository_manifest > "$EVIDENCE_DIR/intent-ack-crash.repository.after.sha256"
          diff -u "$EVIDENCE_DIR/intent-ack-crash.repository.before.sha256" \
            "$EVIDENCE_DIR/intent-ack-crash.repository.after.sha256"

          repository_manifest > "$EVIDENCE_DIR/consumption-crash.repository.before.sha256"
          reset_services
          set_broker_scenario allowed
          sudo install -o root -g root -m 0600 /dev/null \
            /run/ota/authority-launcher-pressure-exit-after-consumption
          case_cursor=$(journal_cursor)
          if sudo systemctl start ota-authority-pressure-runner.service; then
            echo 'post-consumption crash injection unexpectedly completed' >&2
            exit 1
          fi
          capture_journal consumption-crash-first "$case_cursor"
          test "$(systemctl show ota-authority-launcher.service -p ExecMainStatus --value)" = 88
          consumption_crash_slots=$(sudo find /var/lib/ota/authority-launcher/active \
            -mindepth 1 -maxdepth 1 -type f | wc -l)
          printf 'active_slots=%s\n' "$consumption_crash_slots" \
            > "$EVIDENCE_DIR/consumption-crash-first.boundary.txt"
          test "$consumption_crash_slots" -eq 1
          consumption_crash_slot=$(sudo find /var/lib/ota/authority-launcher/active \
            -mindepth 1 -maxdepth 1 -type f -print -quit)
          sudo cp "$consumption_crash_slot" \
            "$EVIDENCE_DIR/consumption-crash-first.active-slot.json"
          sudo chown "$(id -u):$(id -g)" \
            "$EVIDENCE_DIR/consumption-crash-first.active-slot.json"
          jq -e \
            '.stage == "lease_consumption_verified"
             and .authorization_decision.authorization_decision.payload.decision == "allowed"
             and .lease_consumption_intent != null
             and .lease_consumption != null
             and .lease_consumption_intent.consume_request_identity
                 == .lease_consumption.consume_request_identity
             and .lease_consumption.consume_response.payload.state == "consumed"' \
            "$EVIDENCE_DIR/consumption-crash-first.active-slot.json"
          assert_broker_checkpoint consumption-crash-first allowed 1 allowed
          assert_count 1 'bounded pressure v3 stage=lease_consumption_intent_persisted' \
            "$EVIDENCE_DIR/consumption-crash-first.journal.txt"
          assert_count 1 'bounded pressure v3 stage=lease_consume_forwarded' \
            "$EVIDENCE_DIR/consumption-crash-first.journal.txt"
          test ! -e "$PRESSURE_REPOSITORY/selected-work-executed"
          test ! -e "$PRESSURE_REPOSITORY/.ota"

          sudo systemctl reset-failed
          case_cursor=$(journal_cursor)
          if ! sudo systemctl start ota-authority-pressure-runner.service; then
            capture_journal consumption-crash-recovery-start-failure "$case_cursor"
            systemctl show \
              ota-authority-pressure-runner.service \
              ota-authority-launcher.service \
              ota-authority-attestor.service \
              ota-authority-broker-proxy.service \
              > "$EVIDENCE_DIR/consumption-crash-recovery-start-failure.units.txt"
            exit 1
          fi
          capture_journal consumption-crash-recovery "$case_cursor"
          assert_terminal_clean consumption-crash-recovery
          # Recovery consumes no additional frame for the crashed work unit. The accepted retry is
          # a fresh invocation with a different request identity and its own bounded consumption.
          assert_count 1 'bounded pressure v3 stage=lease_consume_forwarded' \
            "$EVIDENCE_DIR/consumption-crash-recovery.journal.txt"
          extract_consumption_relay_evidence consumption-crash-recovery 1
          crashed_consume=$(jq -r '.lease_consumption.consume_request_identity' \
            "$EVIDENCE_DIR/consumption-crash-first.active-slot.json")
          fresh_consume=$(jq -r '.consume_request_identity' \
            "$EVIDENCE_DIR/consumption-crash-recovery.lease-relay-evidence.jsonl")
          test "$fresh_consume" != "$crashed_consume"
          repository_manifest > "$EVIDENCE_DIR/consumption-crash.repository.after.sha256"
          diff -u "$EVIDENCE_DIR/consumption-crash.repository.before.sha256" \
            "$EVIDENCE_DIR/consumption-crash.repository.after.sha256"

          repository_content_manifest > "$EVIDENCE_DIR/repository.after.sha256"
          diff -u "$EVIDENCE_DIR/repository.before.sha256" \
            "$EVIDENCE_DIR/repository.after.sha256"
          test -z "$(git status --porcelain --untracked-files=no)"

          test ! -d "$PRESSURE_REPOSITORY/.ota"
          sudo stat -c '%U %G %a %F' /var/lib/ota/authority-broker-pressure \
            | tee "$EVIDENCE_DIR/broker-state-posture.txt" >/dev/null
          sudo stat -c '%U %G %a %F' \
            /var/lib/ota/authority-broker-pressure/consumed-leases.json \
            | tee -a "$EVIDENCE_DIR/broker-state-posture.txt" >/dev/null
          sed -n '1p' "$EVIDENCE_DIR/broker-state-posture.txt" \
            | grep -Fx 'root root 700 directory'
          sed -n '2p' "$EVIDENCE_DIR/broker-state-posture.txt" \
            | grep -Fx 'root root 600 regular file'
          sudo cp /var/lib/ota/authority-broker-pressure/consumed-leases.json \
            "$EVIDENCE_DIR/consumed-leases.json"
          sudo chown "$(id -u):$(id -g)" "$EVIDENCE_DIR/consumed-leases.json"
          positive_lease=$(jq -r '.prepared_lease_identity' \
            "$EVIDENCE_DIR/positive.lease-relay-evidence.jsonl")
          jq -e --arg lease "$positive_lease" 'index($lease) != null' \
            "$EVIDENCE_DIR/consumed-leases.json" >/dev/null
          sudo rm -rf /var/lib/ota/authority-broker-pressure
          test -z "$(sudo find /var/lib/ota -type f \
            \( -iname '*decision*' -o -iname '*lease*' -o -iname '*receipt*' -o -iname '*archive*' \) \
            -print -quit)"
          systemctl show \
            ota-authority-launcher.service \
            ota-authority-attestor.service \
            ota-authority-broker-proxy.service \
            ota-authority-pressure-runner.service \
            > "$EVIDENCE_DIR/systemd-units.txt"

      - name: Upload bounded V3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: systemd-v3-selected-execution-${{ github.run_id }}
          path: ${{ runner.temp }}/systemd-v3-evidence
          if-no-files-found: error
          retention-days: 14
