name: Systemd V3 execution-disabled pressure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systemd-v3:
    name: Prove complete signed V3 admission without execution
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Launcher source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt

      - name: Install contract-selected Ota
        id: ota
        uses: ota-run/setup@493cba84bf7f7c11c9e8e996d832d93a89c62184
        with:
          source: contract
          contract-path: ota.yaml

      - name: Verify immutable source identities
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/systemd-v3-evidence
          EXPECTED_OTA_REVISION: ${{ steps.ota.outputs.source-git-rev }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          ota --version --json > "$EVIDENCE_DIR/ota-version.json"
          observed_commit=$(jq -er '.commit' "$EVIDENCE_DIR/ota-version.json")
          jq -e '.source_build == true and .dirty == false' "$EVIDENCE_DIR/ota-version.json"
          test -n "$EXPECTED_OTA_REVISION"
          test "${EXPECTED_OTA_REVISION#"$observed_commit"}" != "$EXPECTED_OTA_REVISION"

          git rev-parse HEAD > "$EVIDENCE_DIR/launcher-revision.txt"
          test -z "$(git status --porcelain --untracked-files=no)"
          cargo metadata --locked --format-version 1 > "$EVIDENCE_DIR/cargo-metadata.json"
          protocol_source=$(jq -er '
            .packages[] |
            select(.name == "ota-authority-protocol") |
            .source
          ' "$EVIDENCE_DIR/cargo-metadata.json")
          case "$protocol_source" in
            git+https://github.com/ota-run/authority-protocol.git\?rev=*#*) ;;
            *) echo "authority protocol is not pinned to an immutable git revision" >&2; exit 1 ;;
          esac

      - name: Build exact pressure binaries
        run: |
          set -euo pipefail
          cargo build --release --locked --bins --features \
            'protected-attestor protected-attestor-client systemd-pressure-client systemd-pressure-faults systemd-v3-pressure-provision'

      - name: Provision protected systemd V3 boundary
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/systemd-v3-evidence
          PRESSURE_REPOSITORY: /srv/ota-v3-pressure
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(ps -p 1 -o comm=)" = systemd

          sudo useradd --system --create-home --shell /usr/sbin/nologin ota-authority-job
          sudo useradd --system --create-home --shell /usr/sbin/nologin ota-authority-exec
          test "$(id -u ota-authority-job)" -ne 0
          test "$(id -u ota-authority-exec)" -ne 0
          test "$(id -u ota-authority-job)" -ne "$(id -u ota-authority-exec)"

          sudo install -d -o ota-authority-exec -g ota-authority-exec -m 0755 "$PRESSURE_REPOSITORY"
          sudo tee "$PRESSURE_REPOSITORY/ota.yaml" >/dev/null <<'YAML'
          version: 1
          project:
            name: systemd-v3-pressure
          governance:
            crossing_authority:
              authority_id: platform-release-authority
          tasks:
            governed:
              description: Execution sentinel that must remain unreachable in the V3 admission pressure gate
              command:
                exe: sh
                args:
                  - -c
                  - printf executed > selected-work-must-not-exist
              safe_for_agent: false
          YAML
          sudo chown ota-authority-exec:ota-authority-exec "$PRESSURE_REPOSITORY/ota.yaml"
          sudo chmod 0644 "$PRESSURE_REPOSITORY/ota.yaml"
          (cd "$PRESSURE_REPOSITORY" && ota validate --json) \
            > "$EVIDENCE_DIR/pressure-contract-validation.json"
          jq -e '.ok == true' "$EVIDENCE_DIR/pressure-contract-validation.json"

          sudo install -d -o root -g root -m 0755 /usr/lib/ota-authority/bin
          sudo install -o root -g root -m 0755 target/release/ota-authority-launcher \
            /usr/lib/ota-authority/bin/ota-authority-launcher
          sudo install -o root -g root -m 0755 target/release/ota-authority-attestor \
            /usr/lib/ota-authority/bin/ota-authority-attestor
          sudo install -o root -g root -m 0755 target/release/ota-authority-systemd-pressure-client \
            /usr/lib/ota-authority/bin/ota-authority-systemd-pressure-client
          sudo install -o root -g root -m 0755 "$(command -v ota)" \
            /usr/lib/ota-authority/bin/ota

          sudo /usr/lib/ota-authority/bin/ota-authority-launcher \
            provision-systemd-v3-pressure \
            --authority-id platform-release-authority \
            --job-user ota-authority-job \
            --execution-user ota-authority-exec \
            --repository-root "$PRESSURE_REPOSITORY" \
            --launcher-binary /usr/lib/ota-authority/bin/ota-authority-launcher \
            --attestor-binary /usr/lib/ota-authority/bin/ota-authority-attestor \
            --ota-binary /usr/lib/ota-authority/bin/ota \
            --pressure-client-binary /usr/lib/ota-authority/bin/ota-authority-systemd-pressure-client \
            | tee "$EVIDENCE_DIR/provision.txt"

          sha256sum \
            /usr/lib/ota-authority/bin/ota-authority-launcher \
            /usr/lib/ota-authority/bin/ota-authority-attestor \
            /usr/lib/ota-authority/bin/ota-authority-systemd-pressure-client \
            /usr/lib/ota-authority/bin/ota \
            > "$EVIDENCE_DIR/installed-binaries.sha256"
          sudo cp /etc/ota/authority-launcher-installation.json \
            "$EVIDENCE_DIR/installation-manifest.json"
          sudo cp /etc/ota/authority-attestor-verifiers.json \
            "$EVIDENCE_DIR/attestor-verifiers.json"
          sudo chown "$(id -u):$(id -g)" \
            "$EVIDENCE_DIR/installation-manifest.json" \
            "$EVIDENCE_DIR/attestor-verifiers.json"

      - name: Exercise positive, drift, credential, and recovery controls
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/systemd-v3-evidence
          PRESSURE_REPOSITORY: /srv/ota-v3-pressure
        run: |
          set -euo pipefail

          repository_manifest() {
            sudo find "$PRESSURE_REPOSITORY" -xdev -type f -print0 \
              | sort -z \
              | sudo xargs -0 sha256sum
          }

          assert_terminal_clean() {
            local case_name=$1
            local slots scopes
            slots=$(sudo find /var/lib/ota/authority-launcher/active -mindepth 1 -maxdepth 1 -type f | wc -l)
            scopes=$(systemctl list-units 'ota-authority-invocation-*.scope' --all --no-legend --plain | wc -l)
            printf 'active_slots=%s\nscopes=%s\n' "$slots" "$scopes" \
              > "$EVIDENCE_DIR/$case_name.boundary.txt"
            test "$slots" -eq 0
            test "$scopes" -eq 0
            test ! -e "$PRESSURE_REPOSITORY/selected-work-must-not-exist"
            test ! -e "$PRESSURE_REPOSITORY/.ota"
          }

          capture_journal() {
            local case_name=$1
            local since=$2
            sudo journalctl --no-pager \
              --since "$since" \
              -u ota-authority-pressure-runner.service \
              -u ota-authority-launcher.service \
              -u ota-authority-attestor.service \
              | tee "$EVIDENCE_DIR/$case_name.journal.txt" >/dev/null
          }

          reset_services() {
            sudo systemctl stop ota-authority-launcher.service ota-authority-attestor.service || true
            sudo systemctl reset-failed
          }

          repository_manifest > "$EVIDENCE_DIR/repository.before.sha256"

          case_started=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
          if ! sudo systemctl start ota-authority-pressure-runner.service; then
            capture_journal positive-start-failure "$case_started"
            systemctl show \
              ota-authority-pressure-runner.service \
              ota-authority-launcher.service \
              ota-authority-attestor.service \
              > "$EVIDENCE_DIR/positive-start-failure.units.txt"
            exit 1
          fi
          capture_journal positive "$case_started"
          grep -q 'bounded pressure v3 stage=startup_continuation_sent' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=challenge_received' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=challenge_validated' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=attestation_produced' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=attestation_sent' "$EVIDENCE_DIR/positive.journal.txt"
          grep -q 'bounded pressure v3 stage=authorization_received' "$EVIDENCE_DIR/positive.journal.txt"
          assert_terminal_clean positive
          test "$(systemctl show ota-authority-pressure-runner.service -p Result --value)" = success
          test "$(systemctl is-active ota-authority-attestor.service || true)" != active

          reset_services
          sudo cp /usr/lib/ota-authority/bin/ota-authority-attestor "$RUNNER_TEMP/attestor.clean"
          printf drift | sudo tee -a /usr/lib/ota-authority/bin/ota-authority-attestor >/dev/null
          case_started=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
          if sudo systemctl start ota-authority-pressure-runner.service; then
            echo 'installation drift unexpectedly passed' >&2
            exit 1
          fi
          capture_journal installation-drift "$case_started"
          grep -q 'installation identity is unavailable or mismatched' \
            "$EVIDENCE_DIR/installation-drift.journal.txt"
          assert_terminal_clean installation-drift
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/attestor.clean" \
            /usr/lib/ota-authority/bin/ota-authority-attestor

          reset_services
          sudo install -d -o root -g root -m 0755 \
            /etc/systemd/system/ota-authority-launcher.service.d
          sudo tee /etc/systemd/system/ota-authority-launcher.service.d/zzzzzz-pressure-drift.conf \
            >/dev/null <<'UNIT'
          [Service]
          ProtectSystem=full
          UNIT
          sudo systemctl daemon-reload
          case_started=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
          if sudo systemctl start ota-authority-pressure-runner.service; then
            echo 'systemd runtime drift unexpectedly passed' >&2
            exit 1
          fi
          capture_journal runtime-drift "$case_started"
          grep -q 'effective runtime profile is unavailable or mismatched' \
            "$EVIDENCE_DIR/runtime-drift.journal.txt"
          assert_terminal_clean runtime-drift
          sudo rm /etc/systemd/system/ota-authority-launcher.service.d/zzzzzz-pressure-drift.conf
          sudo systemctl daemon-reload

          reset_services
          sudo mv /var/lib/ota/authority-attestor-signing-key \
            /var/lib/ota/authority-attestor-signing-key.unavailable
          case_started=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
          if sudo systemctl start ota-authority-pressure-runner.service; then
            echo 'missing producer credential unexpectedly passed' >&2
            exit 1
          fi
          capture_journal missing-credential "$case_started"
          grep -Eq 'credential|Pre-authorization protocol|protocol bridge' \
            "$EVIDENCE_DIR/missing-credential.journal.txt"
          assert_terminal_clean missing-credential
          sudo mv /var/lib/ota/authority-attestor-signing-key.unavailable \
            /var/lib/ota/authority-attestor-signing-key

          reset_services
          sudo install -d -o root -g root -m 0755 /run/ota
          sudo install -o root -g root -m 0600 /dev/null \
            /run/ota/authority-launcher-pressure-exit-after-scope
          case_started=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
          if sudo systemctl start ota-authority-pressure-runner.service; then
            echo 'crash injection unexpectedly completed' >&2
            exit 1
          fi
          capture_journal crash-first "$case_started"
          test "$(systemctl show ota-authority-launcher.service -p ExecMainStatus --value)" = 86
          crash_slots=$(sudo find /var/lib/ota/authority-launcher/active -mindepth 1 -maxdepth 1 -type f | wc -l)
          printf 'active_slots=%s\n' "$crash_slots" > "$EVIDENCE_DIR/crash-first.boundary.txt"
          test "$crash_slots" -eq 1
          crash_slot=$(sudo find /var/lib/ota/authority-launcher/active -mindepth 1 -maxdepth 1 -type f -print -quit)
          sudo cp "$crash_slot" "$EVIDENCE_DIR/crash-first.active-slot.json"
          sudo chown "$(id -u):$(id -g)" "$EVIDENCE_DIR/crash-first.active-slot.json"
          jq -e '.stage == "scope_attached" and .child != null and .scope != null' \
            "$EVIDENCE_DIR/crash-first.active-slot.json"
          test ! -e "$PRESSURE_REPOSITORY/selected-work-must-not-exist"

          sudo systemctl reset-failed
          case_started=$(date --utc '+%Y-%m-%dT%H:%M:%SZ')
          if ! sudo systemctl start ota-authority-pressure-runner.service; then
            capture_journal crash-recovery-start-failure "$case_started"
            systemctl show \
              ota-authority-pressure-runner.service \
              ota-authority-launcher.service \
              ota-authority-attestor.service \
              > "$EVIDENCE_DIR/crash-recovery-start-failure.units.txt"
            exit 1
          fi
          capture_journal crash-recovery "$case_started"
          grep -q 'bounded pressure v3 stage=authorization_received' \
            "$EVIDENCE_DIR/crash-recovery.journal.txt"
          assert_terminal_clean crash-recovery

          repository_manifest > "$EVIDENCE_DIR/repository.after.sha256"
          diff -u "$EVIDENCE_DIR/repository.before.sha256" \
            "$EVIDENCE_DIR/repository.after.sha256"
          test -z "$(git status --porcelain --untracked-files=no)"

          test ! -d "$PRESSURE_REPOSITORY/.ota"
          test -z "$(sudo find /var/lib/ota -type f \
            \( -iname '*decision*' -o -iname '*lease*' -o -iname '*receipt*' -o -iname '*archive*' \) \
            -print -quit)"
          systemctl show \
            ota-authority-launcher.service \
            ota-authority-attestor.service \
            ota-authority-pressure-runner.service \
            > "$EVIDENCE_DIR/systemd-units.txt"

      - name: Upload bounded V3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: systemd-v3-execution-disabled-${{ github.run_id }}
          path: ${{ runner.temp }}/systemd-v3-evidence
          if-no-files-found: error
          retention-days: 14
