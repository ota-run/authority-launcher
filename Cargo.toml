[package]
name = "ota-authority-launcher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Trusted launcher for Ota crossing authority"
repository = "https://github.com/ota-run/authority-launcher"
rust-version = "1.95"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.39", features = ["derive"] }
ed25519-dalek = "3.0.0"
getrandom = "0.2"
libc = "0.2.177"
ota-authority-protocol = { git = "https://github.com/ota-run/authority-protocol.git", rev = "845f9a36e4f680e0cbc23838959aa266ae269528" }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.12"
time = { version = "0.3.48", features = ["formatting", "parsing"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.18.0", features = ["blocking-api"] }

[dev-dependencies]
ota-authority-protocol = { git = "https://github.com/ota-run/authority-protocol.git", rev = "845f9a36e4f680e0cbc23838959aa266ae269528" }
tempfile = "3.23.0"

[features]
pressure-peer = []
protected-attestor = []
protected-attestor-client = []
systemd-pressure-client = []
systemd-pressure-faults = []

[[bin]]
name = "ota-authority-pressure-peer"
path = "src/bin/ota-authority-pressure-peer.rs"
required-features = ["pressure-peer"]

[[bin]]
name = "ota-authority-systemd-pressure-client"
path = "src/bin/ota-authority-systemd-pressure-client.rs"
required-features = ["systemd-pressure-client"]

[[bin]]
name = "ota-authority-attestor"
path = "src/bin/ota-authority-attestor.rs"
required-features = ["protected-attestor"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
