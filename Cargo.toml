[package]
name = "ota-authority-launcher"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Trusted launcher for Ota crossing authority"
repository = "https://github.com/ota-run/authority-launcher"
rust-version = "1.95"

[dependencies]
base64 = { version = "0.22.1", optional = true }
clap = { version = "4.5.39", features = ["derive"] }
ed25519-dalek = { version = "3.0.0", optional = true }
getrandom = "0.2"
libc = "0.2.177"
ota-authority-protocol = { git = "https://github.com/ota-run/authority-protocol.git", rev = "953e9e6407c9de030822b1f891046c2829b3c714" }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = { version = "0.2.0", optional = true }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.12"
time = { version = "0.3.48", features = ["formatting"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.18.0", features = ["blocking-api"] }

[dev-dependencies]
ota-authority-protocol = { git = "https://github.com/ota-run/authority-protocol.git", rev = "953e9e6407c9de030822b1f891046c2829b3c714" }
tempfile = "3.23.0"

[features]
pressure-peer = [
  "dep:base64",
  "dep:ed25519-dalek",
  "dep:serde_jcs",
  "dep:time",
]
systemd-pressure-client = []
systemd-pressure-faults = []

[[bin]]
name = "ota-authority-pressure-peer"
path = "src/bin/ota-authority-pressure-peer.rs"
required-features = ["pressure-peer"]

[[bin]]
name = "ota-authority-systemd-pressure-client"
path = "src/bin/ota-authority-systemd-pressure-client.rs"
required-features = ["systemd-pressure-client"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
